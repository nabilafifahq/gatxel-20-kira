<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sedang offline, Kira</title>
<link rel="icon" href="/favicon.ico">
<style>
  @font-face { font-family: Nunito; font-weight: 200 1000; font-display: swap; src: url('/fonts/Nunito.woff2') format('woff2'); }
  @font-face { font-family: Fredoka; font-weight: 300 700; font-display: swap; src: url('/fonts/Fredoka.woff2') format('woff2'); }
  :root { --bg: #FFFCF5; --surface: #FFFFFF; --fg: #6546A5; --lilac: #B99AEF; --lavender: #E9DDFB; --yellow: #FFE69A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: Nunito, system-ui, sans-serif; }
  main { width: 100%; max-width: 520px; background: var(--surface); box-shadow: 0 4px 16px rgba(101, 70, 165, 0.10); border-radius: 24px; padding: 32px 24px; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  h1 { margin: 0; font-family: Fredoka, Nunito, system-ui, sans-serif; font-weight: 600; font-size: 32px; line-height: 40px; }
  p { margin: 0; font-size: 18px; line-height: 29px; }
  a { display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 16px; border: 2px solid var(--fg); background: var(--lilac); color: var(--fg); font-weight: 800; font-size: 20px; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/icons/logo-240.webp" width="120" height="100" alt="Kira">
  <h1>Internet sedang putus</h1>
  <p>Kira belum bisa tersambung. Jawabanmu tersimpan di perangkat ini dan akan terkirim saat internet tersambung lagi.</p>
  <p>Minta tolong orang dewasa untuk memeriksa Wi-Fi, ya.</p>
  <a href="/today">Coba lagi</a>
</main>
</body>
</html>
