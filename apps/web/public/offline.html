<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offline, Kira</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root { --bg: #F5F8FC; --surface: #FFFFFF; --fg: #14202E; --fg-muted: #4A5A6E; --divider: #D3DCE6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--bg); color: var(--fg); font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
  main { width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--divider); border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; gap: 16px; }
  h1 { margin: 0; font-size: 32px; line-height: 40px; }
  p { margin: 0; font-size: 18px; line-height: 29px; }
  .muted { color: var(--fg-muted); }
  a { align-self: flex-start; display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 12px; background: var(--fg); color: var(--surface); font-weight: 700; font-size: 18px; text-decoration: none; }
  a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>No internet right now</h1>
  <p>Kira cannot reach the server at home. Your answers are saved on this tablet and will be sent when the internet is back.</p>
  <p class="muted">Ask a grown-up to check the Wi-Fi and the server at home.</p>
  <a href="/today">Try again</a>
</main>
</body>
</html>
