# APK tablet Kira dari apps/android. Panduan: docs/android.md, keputusan: docs/adr/0006-apk-android.md.
#
# workflow_dispatch: isi kira_url (alamat publik server Kira, https://kira.gatxel.com). release: true membuat GitHub Release
#   apk-<versi> dan butuh empat secret kunci rilis (KIRA_KEYSTORE_BASE64, KIRA_KEYSTORE_PASSWORD,
#   KIRA_KEY_ALIAS, KIRA_KEY_PASSWORD).
# push ke main atau ci/android-*: build uji APK debug dengan alamat dari variabel repo KIRA_URL,
#   atau alamat contoh bila variabel itu kosong.
#
# APK debug ditandatangani kunci debug acak dari runner, jadi tidak bisa dipasang menimpa versi lain.
# Action dipatok ke commit SHA; tag ada di komentar.

name: android-apk

on:
  workflow_dispatch:
    inputs:
      kira_url:
        description: 'Alamat server Kira, misalnya https://kira.gatxel.com'
        required: true
        type: string
      release:
        description: 'Buat GitHub Release apk-<versi> dengan APK terlampir (butuh secret kunci rilis)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - 'ci/android-*'
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Sama dengan versi di docs/android.md untuk build lokal.
  GRADLE_VERSION: '9.7.1'
  # SHA-256 gradle-9.7.1-bin.zip dari services.gradle.org (pengganti distributionSha256Sum wrapper).
  GRADLE_SHA256: acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
  ANDROID_PLATFORM: android-36
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version_name: ${{ steps.apk.outputs.version_name }}
      sha256: ${{ steps.apk.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          missing=()
          [ -d "$ANDROID_HOME/platforms/$ANDROID_PLATFORM" ] || missing+=("platforms;$ANDROID_PLATFORM")
          [ -d "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" ] || missing+=("build-tools;$ANDROID_BUILD_TOOLS")
          if [ "${#missing[@]}" -gt 0 ]; then
            yes | "$sdkmanager" --licenses > /dev/null || true
            "$sdkmanager" --install "${missing[@]}"
          fi
          echo "$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS" >> "$GITHUB_PATH"

      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          # Penyedia cache open source (MIT). Bawaan "enhanced" memakai pustaka proprietary.
          cache-provider: basic

      - name: Check Gradle checksum
        run: |
          zip="$RUNNER_TEMP/.gradle-actions/gradle-installations/downloads/gradle-$GRADLE_VERSION-bin.zip"
          if [ -f "$zip" ]; then
            echo "$GRADLE_SHA256  $zip" | sha256sum --check --strict
          else
            # setup-gradle tidak mengunduh bila Gradle versi yang sama sudah ada di image runner.
            [[ "$(gradle --version)" == *"Gradle $GRADLE_VERSION"* ]]
            echo "Gradle $GRADLE_VERSION dari image runner."
          fi

      - name: Server address
        id: server
        env:
          INPUT_URL: ${{ inputs.kira_url }}
          REPO_URL: ${{ vars.KIRA_URL }}
        run: |
          url="${INPUT_URL:-${REPO_URL:-https://kira.gatxel.com}}"
          url="${url%/}"
          pattern='^https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(:[0-9]{1,5})?$'
          if [[ ! "$url" =~ $pattern ]]; then
            echo "::error title=kira_url::Alamat harus berbentuk https://nama-host.domain tanpa path, misalnya https://kira.gatxel.com"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # Secret hanya dibaca saat dijalankan manual. Build dari push selalu debug.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.KIRA_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.KIRA_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name == 'workflow_dispatch' && secrets.KIRA_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.KIRA_KEY_PASSWORD || '' }}
          WANT_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kira-release.jks"
            echo "KIRA_KEYSTORE_FILE=$RUNNER_TEMP/kira-release.jks" >> "$GITHUB_ENV"
            echo "variant=release" >> "$GITHUB_OUTPUT"
          elif [ "$WANT_RELEASE" = "true" ]; then
            echo "::error title=release::release: true butuh empat secret: KIRA_KEYSTORE_BASE64, KIRA_KEYSTORE_PASSWORD, KIRA_KEY_ALIAS, KIRA_KEY_PASSWORD. Lihat docs/android.md."
            exit 1
          else
            echo "variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        working-directory: apps/android
        env:
          KIRA_URL: ${{ steps.server.outputs.url }}
          VARIANT: ${{ steps.signing.outputs.variant }}
          KIRA_KEYSTORE_PASSWORD: ${{ steps.signing.outputs.variant == 'release' && secrets.KIRA_KEYSTORE_PASSWORD || '' }}
          KIRA_KEY_ALIAS: ${{ steps.signing.outputs.variant == 'release' && secrets.KIRA_KEY_ALIAS || '' }}
          KIRA_KEY_PASSWORD: ${{ steps.signing.outputs.variant == 'release' && secrets.KIRA_KEY_PASSWORD || '' }}
        run: |
          if [ "$VARIANT" = "release" ]; then task=assembleRelease; else task=assembleDebug; fi
          gradle --no-daemon --stacktrace "-PkiraUrl=$KIRA_URL" "$task"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kira-release.jks"

      - name: Verify APK
        id: apk
        working-directory: apps/android
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/"$VARIANT"/*.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Diharapkan satu APK di app/build/outputs/apk/$VARIANT, ditemukan ${#apks[@]}."
            exit 1
          fi
          apk="${apks[0]}"
          apksigner verify --verbose --print-certs "$apk"
          badging="$(aapt2 dump badging "$apk")"
          grep -E "^(package|minSdkVersion|targetSdkVersion):" <<< "$badging"
          grep -q "^package: name='com.gatxel.kira' " <<< "$badging"
          grep -q "^targetSdkVersion:'36'$" <<< "$badging"
          version_name="$(sed -n "s/^package: .* versionName='\([^']*\)'.*/\1/p" <<< "$badging")"
          if [ -z "$version_name" ]; then
            echo "::error::versionName tidak terbaca dari APK."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/dist"
          out="$RUNNER_TEMP/dist/kira-$version_name.apk"
          cp "$apk" "$out"
          sha256="$(sha256sum "$out" | cut -d' ' -f1)"
          size="$(stat -c %s "$out")"
          unzip -l "$out" | tail -n 1
          {
            echo "version_name=$version_name"
            echo "sha256=$sha256"
            echo "path=$out"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### kira-$version_name.apk ($VARIANT)"
            echo
            echo "| Ukuran | SHA-256 |"
            echo "|---|---|"
            echo "| $size byte | \`$sha256\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kira-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
          # APK sudah berupa zip.
          compression-level: 0

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kira-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          APK_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          gh release create "apk-$VERSION_NAME" "dist/kira-$VERSION_NAME.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Kira $VERSION_NAME" \
            --notes "APK tablet Kira $VERSION_NAME dari commit $GITHUB_SHA. SHA-256: $APK_SHA256"
