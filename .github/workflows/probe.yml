name: probe
on:
  push:
    branches: ['ci/android-*']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Runner SDK
        run: |
          exec > >(tee -a "$RUNNER_TEMP/probe.txt") 2>&1
          echo "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          ls /usr/lib/jvm || true
          java -version 2>&1 || true
          echo "JAVA_HOME_21_X64=${JAVA_HOME_21_X64:-}"
          gh --version | head -1
          head -2 /etc/os-release
      - name: Maven and Gradle versions
        shell: python3 {0}
        run: |
          import urllib.request, re, json, zipfile, io, os, sys
          sys.stdout = open(os.path.join(os.environ['RUNNER_TEMP'], 'probe.txt'), 'a')
          def get(url):
              with urllib.request.urlopen(url, timeout=60) as r:
                  return r.read()
          def lm(url):
              req = urllib.request.Request(url, method='HEAD')
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.headers.get('Last-Modified')
              except Exception as e:
                  return 'ERR %s' % e
          G = 'https://dl.google.com/android/maven2'
          C = 'https://repo1.maven.org/maven2'
          def key(v):
              return tuple(int(p) for p in v.split('.'))
          def path(g, a):
              return '%s/%s' % (g.replace('.', '/'), a)
          for base, g, a, aar in [
              (G, 'com.android.tools.build', 'gradle', False),
              (G, 'androidx.core', 'core-ktx', False),
              (G, 'androidx.core', 'core', True),
              (G, 'androidx.activity', 'activity-ktx', False),
              (G, 'androidx.activity', 'activity', True),
              (G, 'androidx.webkit', 'webkit', True),
              (C, 'org.jetbrains.kotlin', 'kotlin-gradle-plugin', False),
          ]:
              x = get('%s/%s/maven-metadata.xml' % (base, path(g, a))).decode()
              allv = re.findall(r'<version>([^<]+)</version>', x)
              print('== %s:%s  (last 12 any: %s)' % (g, a, ' '.join(allv[-12:])))
              st = sorted(set(v for v in allv if re.fullmatch(r'\d+\.\d+\.\d+', v)), key=key)[-7:]
              for v in st:
                  print('   %s  %s' % (v, lm('%s/%s/%s/%s-%s.pom' % (base, path(g, a), v, a, v))))
                  if aar:
                      try:
                          z = zipfile.ZipFile(io.BytesIO(get('%s/%s/%s/%s-%s.aar' % (base, path(g, a), v, a, v))))
                          print('       ' + z.read('META-INF/com/android/build/gradle/aar-metadata.properties').decode().replace('\n', '; '))
                      except Exception as e:
                          print('       aar meta ERR %s' % e)
              if a == 'gradle':
                  for v in st[-3:]:
                      pom = get('%s/%s/%s/%s-%s.pom' % (base, path(g, a), v, a, v)).decode()
                      deps = re.findall(r'<groupId>([^<]+)</groupId>\s*<artifactId>([^<]+)</artifactId>\s*<version>([^<]+)</version>', pom)
                      print('   AGP %s kotlin deps: %s' % (v, [d for d in deps if 'kotlin' in d[0] or 'kotlin' in d[1]]))
          vs = json.loads(get('https://services.gradle.org/versions/all'))
          rel = [v for v in vs if not v.get('snapshot') and not v.get('nightly') and not v.get('releaseNightly') and not v.get('rcFor') and not v.get('milestoneFor') and not v.get('broken')]
          print('== Gradle releases')
          for v in rel[:12]:
              sha = ''
              try:
                  sha = get('https://services.gradle.org/distributions/gradle-%s-bin.zip.sha256' % v['version']).decode().strip()
              except Exception as e:
                  sha = 'ERR %s' % e
              print('   %s  %s  %s' % (v['version'], v['buildTime'], sha))
          cur = json.loads(get('https://services.gradle.org/versions/current'))
          print('   current: %s' % cur.get('version'))
      - name: Emit annotations
        if: always()
        run: |
          python3 - <<'PY'
          import os
          lines = open(os.path.join(os.environ['RUNNER_TEMP'], 'probe.txt')).read().splitlines()
          for i in range(0, len(lines), 45):
              chunk = '\n'.join(lines[i:i+45])
              enc = chunk.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::notice title=probe %d::%s' % (i // 45, enc))
          PY
